[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-fit-picker"
version = "0.7.0"
description = "A local-first desktop app for grouping and reviewing similar photos."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ExifRead>=3.0,<4",
    "numpy>=1.23,<3",
    "opencv-python-headless>=4.10,<5",
    "Pillow>=10.0,<13",
    "PySide6-Essentials>=6.6,<7",
    "pillow-heif>=0.16,<1",
    "qtawesome>=1.4,<2",
    "rawpy>=0.19,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pyinstaller>=6.6,<7",
]

[project.scripts]
photo-fit-picker = "photo_fit_picker.main:main"
photo-fit-picker-engine = "photo_fit_picker.bridge:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
