name: Build Tauri preview

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional prerelease tag, for example v0.8.0-alpha.1"
        required: false
        type: string
  push:
    branches:
      - rewrite/tauri-react
    paths:
      - "desktop/**"
      - "src/photo_fit_picker/**"
      - "tests/**"
      - "photo-engine.spec"
      - "run_engine.py"
      - "pyproject.toml"
      - ".github/workflows/tauri-next.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: photo-fit-picker-next-macos
            bundles: dmg
            bundle: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-2022
            artifact: photo-fit-picker-next-windows
            bundles: nsis
            bundle: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: python -m pytest --tb=short
      - name: Build local photo engine
        run: python -m PyInstaller --noconfirm --clean --distpath dist/engine photo-engine.spec

      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Prepare Tauri sidecar
        shell: bash
        run: |
          set -euo pipefail
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p desktop/src-tauri/binaries
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cp dist/engine/photo-engine.exe "desktop/src-tauri/binaries/photo-engine-${target}.exe"
          else
            cp dist/engine/photo-engine "desktop/src-tauri/binaries/photo-engine-${target}"
            chmod +x "desktop/src-tauri/binaries/photo-engine-${target}"
          fi
      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --no-frozen-lockfile
      - name: Build desktop application
        working-directory: desktop
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  prerelease:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Preview release tag must look like v0.8.0-alpha.1"
            exit 1
          fi
          gh release create "${RELEASE_TAG}" \
            release-assets/* \
            --target "${GITHUB_SHA}" \
            --title "拾影 ${RELEASE_TAG} 预览版" \
            --generate-notes \
            --prerelease
