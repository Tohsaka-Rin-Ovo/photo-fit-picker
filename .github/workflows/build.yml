name: Build and release desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build app
        run: python -m PyInstaller --noconfirm --clean photo-fit-picker.spec
      - name: Create DMG
        shell: bash
        run: |
          mkdir -p dist/dmg dist/release
          cp -R "dist/拾影.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname "拾影" \
            -srcfolder dist/dmg \
            -ov \
            -format UDZO \
            dist/release/PhotoFitPicker-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: photo-fit-picker-macos
          path: dist/release/PhotoFitPicker-macOS.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build app
        run: python -m PyInstaller --noconfirm --clean photo-fit-picker.spec
      - name: Create Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          $env:APP_VERSION = $env:APP_VERSION -replace '^v', ''
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+') {
            $env:APP_VERSION = '0.1.2-dev'
          }
          New-Item -ItemType Directory -Force -Path dist/release
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          if (-not (Test-Path "dist\PhotoFitPicker.exe")) {
            throw "PyInstaller output dist\PhotoFitPicker.exe was not found"
          }
          & $compiler installer.iss
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - uses: actions/upload-artifact@v4
        with:
          name: photo-fit-picker-windows
          path: dist/release/PhotoFitPicker-Windows-x64-Setup.exe
          if-no-files-found: error

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.build-macos.result == 'success' }}
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum PhotoFitPicker-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/PhotoFitPicker-* \
            release-assets/SHA256SUMS.txt \
            --title "拾影 ${GITHUB_REF_NAME}" \
            --generate-notes
