name: Build and release desktop apps

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new v-prefixed release tag (leave blank to only build)"
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build app
        run: python -m PyInstaller --noconfirm --clean photo-fit-picker.spec
      - name: Create DMG
        shell: bash
        run: |
          mkdir -p dist/dmg dist/release
          cp -R "dist/拾影.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create \
            -volname "拾影" \
            -srcfolder dist/dmg \
            -ov \
            -format UDZO \
            dist/release/PhotoFitPicker-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: photo-fit-picker-macos
          path: dist/release/PhotoFitPicker-macOS.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build app
        run: python -m PyInstaller --noconfirm --clean photo-fit-picker.spec
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found after installation"
          }
          New-Item -ItemType Directory -Force -Path installer-languages | Out-Null
          $languageUrl = "https://raw.githubusercontent.com/jrsoftware/issrc/1ae7bf81dc0d2013235dfe4bb0b6f4e4a0b6b25c/Files/Languages/ChineseSimplified.isl"
          $languagePath = "installer-languages\ChineseSimplified.isl"
          Invoke-WebRequest -Uri $languageUrl -OutFile $languagePath
          $languageHash = (Get-FileHash -Algorithm SHA256 $languagePath).Hash.ToLowerInvariant()
          if ($languageHash -ne "e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d") {
            throw "ChineseSimplified.isl checksum did not match the pinned source"
          }
      - name: Create Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          $env:APP_VERSION = $env:APP_VERSION -replace '^v', ''
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+') {
            $env:APP_VERSION = '0.1.2-dev'
          }
          New-Item -ItemType Directory -Force -Path dist/release
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          if (-not (Test-Path "dist\PhotoFitPicker.exe")) {
            throw "PyInstaller output dist\PhotoFitPicker.exe was not found"
          }
          $compilerOutput = & $compiler installer.iss 2>&1
          $compilerExitCode = $LASTEXITCODE
          $compilerOutput | Write-Output
          if ($compilerExitCode -ne 0) {
            $message = ($compilerOutput | Out-String).Trim()
            $message = $message -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error file=installer.iss,title=Inno Setup compilation failed::$message"
            exit $compilerExitCode
          }
      - uses: actions/upload-artifact@v4
        with:
          name: photo-fit-picker-windows
          path: dist/release/PhotoFitPicker-Windows-x64-Setup.exe
          if-no-files-found: error

  release:
    if: >-
      ${{
        always() &&
        needs.build-macos.result == 'success' &&
        needs.build-windows.result == 'success' &&
        (
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish:v'))
        )
      }}
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum PhotoFitPicker-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ -n "${MANUAL_RELEASE_TAG}" ]]; then
            release_tag="${MANUAL_RELEASE_TAG}"
          elif [[ "${COMMIT_MESSAGE}" =~ \[publish:(v[0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            release_tag="${BASH_REMATCH[1]}"
          else
            echo "No release tag was supplied"
            exit 1
          fi

          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the form v1.2.3"
            exit 1
          fi

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" \
              release-assets/PhotoFitPicker-* \
              release-assets/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${release_tag}" \
              release-assets/PhotoFitPicker-* \
              release-assets/SHA256SUMS.txt \
              --title "拾影 ${release_tag}" \
              --generate-notes
          fi
